[package]
name = "itgmania-harness-rs"
version = "0.1.89"
edition = "2024"
description = "Rust CLI for generating reference values with ITGmania internals"
license = "MIT"

[dependencies]
md5 = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11.0"
tar = "0.4.46"
toml = "1.1"
zstd = { version = "0.14.0", features = ["zstdmt"] }

[build-dependencies]
cc = "1.2"
