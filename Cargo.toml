[package]
name = "itgmania-harness-rs"
version = "0.1.32"
edition = "2024"
description = "Rust CLI for generating reference values with ITGmania internals"
license = "MIT"

[dependencies]
md5 = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tar = "0.4.46"
toml = "1.1"
zstd = "0.14.0"

[build-dependencies]
cc = "1.2"
